name: Bug report
description: Report something that is not working as expected.
labels: [bug]
body:
  - type: input
    id: package-version
    attributes:
      label: Package version
      placeholder: '8.5.0'
    validations:
      required: true
  - type: input
    id: php-version
    attributes:
      label: PHP version
      placeholder: '8.5'
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: 'Ubuntu 24.04'
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the problem.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The steps that lead to the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: The slug you expected, e.g. `hello-world`.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: The slug you got, plus any error messages or stack traces.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: The smallest snippet that shows the problem. Please mention whether `ext-intl` is installed.
      render: php
      placeholder: |
        use Pharaonic\Slugify\Slugify;

        var_dump(Slugify::make('...'));
    validations:
      required: true
